[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sfsc"
version = "1.0.0"
description = "Steel Fan Support Calc — Dimensionamento de suportes metálicos para ventiladores industriais"
authors = [{name = "Tensor - Construcao Civil Lda"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "streamlit>=1.30.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=4.1.0"]

[project.urls]
Repository = "https://github.com/engpaulocosta-bim/orzio-fan-support-calc"
Releases = "https://github.com/engpaulocosta-bim/orzio-fan-support-calc/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
