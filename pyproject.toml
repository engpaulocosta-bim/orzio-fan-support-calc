[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfsc"
version = "1.2.0"
description = "Steel Fan Support Calc — Dimensionamento de suportes metálicos para ventiladores industriais"
authors = [{name = "Tensor - Construcao Civil Lda"}]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.2",
    "pandas>=2.1.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML",
    "pre-commit>=3.7.0",
]
# Shell nativa Windows (pywebview) — só necessária para o build desktop portátil.
desktop = ["pywebview>=6.2.1"]

[project.urls]
Repository = "https://github.com/engpaulocosta-bim/orzio-fan-support-calc"
Releases = "https://github.com/engpaulocosta-bim/orzio-fan-support-calc/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# ── Ruff (lint + format) ────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E501 (comprimento de linha) é gerido pelo formatter; B008 permite Field(...) como default.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Testes podem reimportar enums por clareza e usar asserts longos.
"tests/*" = ["E741"]

# ── mypy (gradual) ──────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
# Base permissiva — o núcleo de cálculo é endurecido por módulo abaixo.
check_untyped_defs = true

[[tool.mypy.overrides]]
# Núcleo de domínio: tipagem mais apertada.
module = ["sfsc.models", "sfsc.policy", "sfsc.assessment", "sfsc.units"]
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
# TODO(Fase 2+): elevar engines/reports/ui para disallow_untyped_defs.
module = ["sfsc.engines.*", "sfsc.reports.*", "sfsc.ui.*", "sfsc.catalogs.*"]
disallow_untyped_defs = false
