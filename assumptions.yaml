assumptions:
  - id: A-GEN-001
    description: "Carga estática equivalente: o peso do ventilador é tratado como carga estática amplificada pelo factor dinâmico."
    impact: "Conservativo para arranques normais; sub-conservativo para cargas impulsivas (explosão de ventilador). Declara ENGINEERING_ESTIMATE."
  - id: A-GEN-002
    description: "Factor dinâmico default 1.5 conforme VDI 3840."
    impact: "Adequado para ventiladores industriais centrifugos e axiais de velocidade fixa. Para velocidade variável ou arrancadas frequentes, utilizar factor superior."
  - id: A-GEN-003
    description: "Factor sísmico de tabela interna por país/zona."
    impact: "Estimativa conservativa. Verificar sempre com o zonamento sísmico local conforme EN 1998-1 (EC8) ou norma nacional aplicável."
  - id: A-STR-001
    description: "Secção transversal verificada em estado plano — sem torção de empenamento."
    impact: "Conservativo para perfis em I com encurvadura lateral impedida. Para consolas longas não travadas, verificar encurvadura lateral-torsional (LTB) por especialista."
  - id: A-STR-002
    description: "Combinação de acções EC1 ULS fundamental: 1.35G + 1.5Q."
    impact: "Conforme EN 1990 cl. 6.4.3.2. Para países fora da EU, coeficientes adaptados (NBR, NCh) — ver norma aplicável."
  - id: A-STR-003
    description: "Comprimento de encurvadura assumido igual ao comprimento real do elemento."
    impact: "Conservativo. Para elementos com restrições de extremidade definidas, o comprimento efectivo pode ser reduzido."
  - id: A-BP-001
    description: "Tensão de contacto da chapa de assento distribuída uniformemente na área efectiva."
    impact: "Aproximação. Para chapas de geometria complexa, verificar com FEA."
  - id: A-BP-002
    description: "Soldadura chapa-perfil verificada por tensão nominal. Não considera concentração de tensões na raiz do cordão."
    impact: "Adequado para EXC2. Para EXC3/EXC4, verificar fatiga e raiz por especialista."
  - id: A-ANC-001
    description: "Capacidade de ancoragem calculada por EC2-4 / BS 8539 / NBR 6122 — resistência de aço governa."
    impact: "Para ancoragens em betão de fraca qualidade (<C20/25) ou betão fendilhado, reduzir capacidade. Verificar pull-out por especialista."
  - id: A-VIB-001
    description: "Anti-vibração por molas/silentblocks: calculado estaticamente com carga estática equivalente."
    impact: "O dimensionamento dinâmico das molas (frequência natural, isolamento) está fora do âmbito. Verificar com fabricante de molas e engenheiro de vibração."
  - id: A-FAT-001
    description: "Análise de fadiga não realizada (EN 1993-1-9 fora do âmbito)."
    impact: "Para ventiladores com arranques frequentes (>10 000 ciclos) ou velocidade variável, a fadiga pode ser dimensionante. Requer análise especializada."
